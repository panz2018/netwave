# Root tooling project for repo governance scripts (scripts/ gates and their
# tests). Private: never published. Not a uv workspace member root — python/
# stays an independent uv project so release-artifact dependencies remain
# separate (uv resolves the nearest pyproject.toml upward from cwd).
[project]
name = "netwave-workspace"
version = "0.0.0"
description = "Repo governance tooling (version gates, checks)"
requires-python = ">=3.14"
license = "MIT OR Apache-2.0"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12"]

[tool.pytest.ini_options]
# Test discovery lives here, not in commands: new test domains under
# scripts/tests/ are covered without touching package.json or ci.yml.
testpaths = ["scripts/tests"]
# scripts/tests import the versions-domain library as `lib.*` and the
# top-level gates (coverage_gate) as bare modules; put both parents on the
# path so pytest works from the repo root.
pythonpath = ["scripts", "scripts/versions"]
# Coverage runs on every pytest invocation; scope and floor live only in
# [tool.coverage] below (single source of truth, never duplicated in
# package.json or ci.yml).
addopts = ["--cov", "--cov-report=term"]

[tool.coverage.run]
# Grading layer of every coverage floor: the versions domain plus the two
# gate scripts that grade codecov reports and police comment hygiene. A
# regression here invalidates all floors, so all three carry a 100% floor.
# Bare module names (not paths): the gates are imported as top-level
# modules through `pythonpath` above, and coverage resolves them the same way.
source = ["scripts/versions", "coverage_gate", "check_comments"]

[tool.coverage.report]
fail_under = 100
