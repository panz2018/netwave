[package]
name = "netwave-native"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "netwave_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
netwave = { path = "../../core" }
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
