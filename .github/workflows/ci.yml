name: CI

on:
  push:
    branches: "**"
  pull_request:

# One CI run per branch: a new push cancels the previous in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Jobs are ordered cheap-first: docs (seconds) -> rust -> wasm ->
# python -> node -> bench (most expensive). One job per language/
# toolchain; platforms expand inside each job. A step that only applies
# to one matrix cell uses a step-level `if` — cheaper than a separate
# job (no extra runner spin-up, checkout or toolchain install).
jobs:
  # Lint gate: every language's lint+format+type check, delegated to the
  # root package.json check:* scripts — the single source of truth for
  # command details. Matrix jobs below only run tests (they need compiled
  # artifacts); never duplicate a check command there. The rust test chain
  # is delegated the same way: package.json test:rs and this file both call
  # scripts/run/test_rs.sh.
  # ubuntu-latest ships rust + python preinstalled; uv and pnpm are setup.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: components for the pinned toolchain
        # rust-toolchain.toml pins the ACTIVE toolchain; the setup above
        # installs components on @stable, not on the pinned one (rustup
        # auto-installs the pinned toolchain bare). Add them to whichever
        # toolchain is active so cargo fmt/clippy resolve.
        run: rustup component add rustfmt clippy
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
      - name: lint gate (md + ts + rs + py, defined in root package.json)
        # Build-free by design: `check:ts` is Biome only. The tsc type gate
        # resolves the shells' imports of the generated bindings (dist/),
        # so it runs in the node job after both glues are built.
        run: |
          pnpm install
          # Root uv tool env: pre-build it and assert uv.lock is fresh
          # (drift vs pyproject.toml fails here, not inside check:py).
          # Governance-script unit tests run inside `pnpm check` (check:py)
          # — command details live only in root package.json.
          uv sync --locked
          pnpm check

  # Rust matrix: native platforms only (macOS covers Apple Silicon).
  # wasm32 lives in its own `wasm` job below: it shares no step
  # with the native cells (no cargo test; needs wasm target + wasm-pack +
  # pnpm), so keeping it here would need an `if` on nearly every step.
  rust:
    name: rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-26.04-arm
          - target: windows-x64
            os: windows-latest
          - target: darwin-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: install cargo-llvm-cov (latest official binary)
        # cargo install compiles for minutes; official prebuilt tarballs.
        # Every platform cell installs and smoke-tests the binary.
        # GITHUB_TOKEN: authenticated API calls (see wasm job).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install_cargo_llvm_cov.sh
      - name: rust test entry (core coverage + build watchdog + profraw drain)
        # Command details live once in scripts/run/test_rs.sh — the same file
        # local `pnpm test:rs` calls (llvm-cov -p netwave, coverage_gate floor
        # 100, build watchdog, pre/post stray-profraw drain). No pnpm/Node
        # env here: the script only needs cargo + python3.
        run: bash scripts/run/test_rs.sh
      - name: upload core coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-${{ matrix.target }}
          path: coverage/coverage-core.json

  # wasm: browser is the primary target -> first-class job, zero
  # conditionals, full OS matrix: wasm codegen differs per host toolchain,
  # so build + vitest run on every platform (installer scripts cover
  # linux/macOS/windows).
  wasm:
    name: wasm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: install binaryen (wasm-opt, latest)
        # Always latest: wasm-pack's built-in download is stuck on binaryen
        # 117, and pinning a version here would rot.
        # GITHUB_TOKEN: authenticated API calls (runners share IPs; the
        # anonymous 60 req/h quota gets exhausted by parallel jobs).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install_binaryen.sh
      - name: install wasm-pack (latest official binary)
        # cargo install compiles for minutes; official prebuilt tarballs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install_wasm_pack.sh
      - uses: pnpm/action-setup@v6
      - name: wasm build + vitest (wasm artifacts)
        # bash: keeps `ls -la` working on Windows (pwsh has no -la).
        shell: bash
        run: |
          pnpm install
          pnpm -C typescript build:wasm
          # Diagnostics: vitest resolves ../dist/wasm-web/netwave_wasm.js;
          # list it so a missing-artifact failure names what build:wasm left.
          ls -la typescript/dist/wasm-web
          pnpm -C typescript test:wasm
      - name: install Chromium (headless shell only)
        # The main thread must never touch wasm, which is only provable in a
        # real browser; the suite runs headless, so the headless shell suffices.
        run: pnpm -C typescript exec playwright install --only-shell chromium
      - name: vitest (real browser, coverage 100)
        run: pnpm -C typescript test:browser

  # Python matrix: ubuntu runs the floor (3.10) + latest (3.15);
  # windows/macos/linux-arm64 run latest only — the point there is the
  # platform ABI (.so/.pyd/.dylib + zero-copy base object), not the
  # version spread.
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
          - os: ubuntu-26.04-arm
            python-version: "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # maturin compiles the crate: ubuntu/macos runners ship rust
      # preinstalled, windows does not — install it explicitly.
      - uses: dtolnay/rust-toolchain@stable
      # pinned full tag: setup-uv publishes no floating major tag (v10)
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: install cargo-llvm-cov (latest official binary)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install_cargo_llvm_cov.sh
      - name: python test entry (glue coverage + python pytest + profraw drain)
        # Command details live once in scripts/run/test_py.sh — the same file
        # local `pnpm test:py` calls (show-env, clean --workspace, maturin
        # develop, pytest, coverage_gate floor 100, pre/post stray-profraw
        # drain). show-env/clean/build/test/report share the script's single
        # process, so the instrumentation env never crosses a step boundary.
        shell: bash
        run: bash scripts/run/test_py.sh
      - name: upload python glue coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage/coverage-python.json

  # Node matrix: ubuntu runs the floor (22) + latest (26);
  # windows/macos/linux-arm64 run latest only — the point there is the
  # platform ABI (.node addon + napi external zero-copy), not the
  # version spread.
  node:
    name: node (${{ matrix.os }}, ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22"
          - os: ubuntu-latest
            node-version: "26"
          - os: windows-latest
            node-version: "26"
          - os: macos-latest
            node-version: "26"
          - os: ubuntu-26.04-arm
            node-version: "26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable # required on windows
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: pnpm install
      - name: install wasm toolchain
        # Own step: the installers append to GITHUB_PATH, which only
        # takes effect for *later* steps — build:wasm must not share
        # this step (its PATH export dies with the bash subprocess).
        # GITHUB_TOKEN: authenticated API calls (see wasm job).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/install_wasm_pack.sh
          bash scripts/install_binaryen.sh
      - name: install cargo-llvm-cov (latest official binary)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install_cargo_llvm_cov.sh
      - name: typescript test entry (wasm build + native glue coverage + typecheck
          + dts any + wasm suite + profraw drain)
        # Command details live once in scripts/run/test_ts.sh — the same file
        # local `pnpm test:ts` calls (build:wasm, show-env/clean/build:native:debug/
        # test:native/report/gate floor 100, typecheck, dts any check, test:wasm,
        # pre/post stray-profraw drain). show-env/clean/build/test/report share the
        # script's single process, so the instrumentation env never crosses a step
        # boundary. The --coverage flag is baked into typescript/package.json's
        # test:native/test:wasm, not repeated here.
        shell: bash
        run: bash scripts/run/test_ts.sh
      - name: upload native glue coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-native-${{ matrix.os }}-${{ matrix.node-version }}
          path: coverage/coverage-native.json
      - name: cross-binding test entry (python glue build + stub_gen +
          four-end dump + grading + cross-end vocabulary gates)
        # Command details live once in scripts/run/test_cross.sh — the same file
        # local `pnpm test:cross` calls (uv sync, maturin develop, stub_gen with
        # the uv libpython LIBDIR export, four-end dump, compare_cross.py
        # grading with the built-in anti-tautology tamper self-check,
        # check_vocab_types.py, check_verbs.py). The napi/wasm artifacts the
        # dumps read are built by the test_ts.sh step above.
        shell: bash
        run: bash scripts/run/test_cross.sh

  # criterion baseline: regressions >20% fail
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: bench vs previous baseline
        run: |
          # Compare against the default 'base' baseline if one exists (the
          # first run has none -> no comparison data, gate passes). Without
          # cross-commit persistence this only measures run-to-run noise.
          cargo bench --bench scaffold -- --baseline-lenient=base || true
          cargo bench --bench scaffold -- --save-baseline=ci
          # Fail if current regressed >20% against the saved baseline.
          python3 scripts/bench_gate.py target/criterion
