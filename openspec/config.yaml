schema: spec-driven

context: |
  全部硬约束的唯一真相源是 openspec/specs/project-governance/spec.md，
  按任务路由读：改文档/流程/法务读元规则段，改产品代码/API/CI 读铁律段；
  agent 行为准则见仓库根 AGENTS.md。动手前先读，禁止绕过。
  本文件只保留 OpenSpec 工件专属规则（见 rules）。

# Per-artifact rules
rules:
  proposal:
    - 必须包含 "## Non-goals" 段，至少一条非空条目，明确本次不做什么
    - 必须包含 "## Prior art" 段，至少一条非空条目且含 URL、仓库内文件路径
      或「无现成方案」声明（门禁 scripts/check_proposal.py 同口径判定）
    - 必须包含 "## 专家增补" 段（顶尖专家会补充哪些没人要求的事）；内容可为空
      或写「无」；非空时每条须含反引号标识符、仓库内文件路径或 URL 之一
      （门禁 scripts/check_proposal.py 同口径判定）
    - 引用受影响的铁律编号（若有）
    - 全部工件（proposal/specs delta/design/tasks）完成后 MUST 执行工件自洽审：
      四件互查矛盾、超限、与 governance spec 及既有主 spec 口径冲突，
      硬伤清零才算提案完成
  specs:
    - 每条 Requirement 必须可测，附容差（引用 manifest key，不写死数值）
    - 数值需求必须指明独立真值来源（skrf golden / 闭式解 / 物理不变量）
    - 涉及 RF 术语时，以权威术语表（knowledge/RF 下 S-Parameters 书 / Touchstone 规范）
      为编写依据，定义直接写入 spec 正文（自包含），禁止"见某书某章"式引用，不得自造定义
  tasks:
    - 每个数值实现任务前必须先有一条会失败的测试（red 先于 green）
    - 跨端改动必须包含 cross-binding 跨绑定对拍任务
    - 数值实现任务的验收标准须包含"docs 达到教学式标准（宪法元规则）"
    - tasks.md 在 check:outdated 任务之前 MUST 有一条三轴 review 任务：按
      governance spec「元规则 review 三轴」（Standards/Spec/Lessons）对照
      本 change 工件审实现 diff，硬伤清零才准入最后一项 check:outdated
      任务
    - tasks.md 最后一项任务 MUST 是跑 pnpm check:outdated 并按
      dependency-upgrade spec「apply 末尾体检与升级预授权」消化所报 LAG：
      升级 + 全闸门 + 四端对拍（含全局 CLI/直装工具的机器级升级），
      上游 bug/不兼容登记回退不阻塞；仅设计级适配、restrictions.json
      破损、流程走不通才停下报告；下限变更（MSRV、engines.node、
      CI 底线格）等人工发起。消化完成后 MUST 复跑 pnpm check:outdated
      至退出码 0（SUMMARY 归零）才算本项完成，防漏消化

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - 本次 change 完成的任务/定案的结论，其在 Plan/ 中的对应章节必须
        当场删除（不留已完成的规划文字），只保留未执行或待改善的任务；
        删后跑 pnpm check:md
      - apply 完成前扫 openspec/specs/ 全目录，对照本次改动产出
        "更新/新增/退役"三态时效结论（哪些 spec 需改而未改、需新增、
        可退役），留痕于本 change 的 tasks.md 完成记录；结构一致性由
        check_md.py SPECS ROUTER 门禁兜底
      - apply 倒数第二步（check:outdated 之前）MUST 按 governance spec
        「元规则 review 三轴」对照本 change 工件（proposal/specs/design/
        tasks）审实现 diff，硬伤清零才准入最后一项 check:outdated
      - apply 全部任务完成后，最后一项 MUST 是跑 pnpm check:outdated
        并按 dependency-upgrade spec「apply 末尾体检与升级预授权」消化
        所报 LAG（升级 + 全闸门 + 四端对拍，含全局 CLI/直装工具的
        机器级升级；登记回退不阻塞，设计级适配/契约破损/流程走不通
        才停下报告；下限变更等人工发起）；消化后 MUST 复跑
        pnpm check:outdated 至退出码 0（SUMMARY 归零）才算完成
  archive:
    guidance:
      - 归档前必须执行 Plan/ 瘦身检查：grep Plan/ 中与本 change 相关的条目，
        已完成/已定案的章节一律删除（结论已在主 spec——openspec 是结论的
        唯一事实源，Plan/ 不留存）、与主 spec 冲突的当场指出；Plan/ 只留
        未执行任务，终态是整目录删除（追溯靠 git log）
      - 归档完成（sync 核对与目录移动）后 MUST 执行 archive-health-check
        spec 规定的五维只读体检，发现由主代理写入 Plan/ 等人工点名，
        不阻塞归档（触发时机、只读边界、三级去重、上限与硬伤标注等
        规则本体见该 spec，本条不复述）
      - 归档前扫 openspec/specs/ 全目录做三态时效检查（更新/新增/退役），
        结论留痕归档工件；specs/README.md 路由表随增删同步更新
