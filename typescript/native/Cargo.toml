[package]
name = "netwave-native"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
license-file = "../../LICENSE-MIT"

[lib]
name = "netwave_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
netwave = { path = "../../core", features = ["node"] }
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
