[workspace]
resolver = "2"
# typescript/native and typescript/wasm stay out until their manual
# review lands (2026-09-25); untracked dirs broke CI cargo metadata.
# Non-member crates inside the workspace dir must be listed in exclude,
# or maturin/cargo metadata fails ("believes it's in a workspace when
# it's not").
members = ["core", "python"] # , "typescript/native", "typescript/wasm"]
exclude = ["typescript/native", "typescript/wasm"]

# Release profile: LTO for wasm binary size (spec: zero-copy-roundtrip).
[profile.release]
lto = true
opt-level = 3
