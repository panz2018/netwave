name: CI

on:
  push:
    branches: "**"
  pull_request:

# One CI run per branch: a new push cancels the previous in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Jobs are ordered cheap-first: docs (seconds) -> rust -> wasm ->
# python -> node -> bench (most expensive). One job per language/
# toolchain; platforms expand inside each job. A step that only applies
# to one matrix cell uses a step-level `if` — cheaper than a separate
# job (no extra runner spin-up, checkout or toolchain install).
jobs:
  # Lint gate: every language's lint+format+type check, delegated to the
  # root package.json check:* scripts — the single source of truth for
  # command details. Matrix jobs below only run tests (they need compiled
  # artifacts); never duplicate a check command there.
  # ubuntu-latest ships rust + python preinstalled; uv and pnpm are setup.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
      - name: lint gate (md + ts + rs + py, defined in root package.json)
        run: |
          pnpm install
          pnpm check

  # Rust matrix: native platforms only (macOS only Apple Silicon, Intel x64
  # dropped). wasm32 lives in its own `wasm` job below: it shares no step
  # with the native cells (no cargo test; needs wasm target + wasm-pack +
  # pnpm), so keeping it here meant an `if` on nearly every step.
  rust:
    name: rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-26.04-arm
          - target: windows-x64
            os: windows-latest
          - target: darwin-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: cargo test
        run: cargo test --workspace
      - name: llvm-cov (100% floor, ubuntu x64 only)
        # Single cell: llvm-cov is weak on Windows/MSVC, and coverage of
        # the same code + tests is host-comparable. Binding crates
        # (python, typescript native/wasm) need a JS/Python runtime and
        # are covered by pytest/vitest in their own jobs (spec-sanctioned
        # exclusion, structurally unreachable under cargo test).
        if: matrix.target == 'linux-x64'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --fail-under-lines 100 \
            --ignore-filename-regex '(python|typescript/(native|wasm))/src/lib\.rs'

  # wasm: browser is the primary target -> first-class job, zero
  # conditionals, full OS matrix: wasm codegen differs per host toolchain,
  # so build + vitest run on every platform (installer scripts cover
  # linux/macOS/windows).
  wasm:
    name: wasm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: install binaryen (wasm-opt, latest)
        # Always latest: wasm-pack's built-in download is stuck on binaryen
        # 117; pinning a version here would rot (AGENTS.md dependency policy).
        run: bash scripts/install_binaryen.sh
      - name: install wasm-pack (latest official binary)
        # cargo install compiles for minutes; official prebuilt tarballs.
        run: bash scripts/install_wasm_pack.sh
      - uses: pnpm/action-setup@v6
      - name: wasm build + vitest (wasm artifacts)
        # bash: keeps `ls -la` working on Windows (pwsh has no -la).
        shell: bash
        run: |
          pnpm install
          pnpm -C typescript build:wasm
          # Diagnostics: vitest resolves ../dist/wasm-web/netwave_wasm.js;
          # list it so a missing-artifact failure names what build:wasm left.
          ls -la typescript/dist/wasm-web
          pnpm -C typescript test:wasm --coverage

  # Python matrix: ubuntu runs the floor (3.10) + latest (3.14);
  # windows/macos run latest only — the point there is the platform ABI
  # (.so/.pyd/.dylib + zero-copy base object), not the version spread.
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # maturin compiles the crate: ubuntu/macos runners ship rust
      # preinstalled, windows does not — install it explicitly.
      - uses: dtolnay/rust-toolchain@stable
      # pinned full tag: setup-uv publishes no floating major tag (v10)
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: sync + build + test
        working-directory: python
        run: |
          uv sync
          uv run maturin develop
          uv run pytest --cov=netwave --cov-fail-under=100

  # Node matrix: ubuntu runs the floor (22) + latest (26);
  # windows/macos run latest only — the point there is the platform ABI
  # (.node addon + napi external zero-copy), not the version spread.
  # Re-enabled 2026-09-26 after the typescript manual review landed.
  node:
    name: node (${{ matrix.os }}, ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22"
          - os: ubuntu-latest
            node-version: "26"
          - os: windows-latest
            node-version: "26"
          - os: macos-latest
            node-version: "26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable # required on windows
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
      - run: pnpm install
      - name: napi build
        run: pnpm -C typescript build:native
      - name: vitest (native, coverage 100)
        run: pnpm -C typescript test:native --coverage
      - name: install wasm toolchain
        # Own step: the installers append to GITHUB_PATH, which only
        # takes effect for *later* steps — build:wasm must not share
        # this step (its PATH export dies with the bash subprocess).
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/install_wasm_pack.sh
          bash scripts/install_binaryen.sh
      - name: wasm-pack build
        run: pnpm -C typescript build:wasm
      - name: vitest (wasm, coverage 100)
        run: pnpm -C typescript test:wasm --coverage
      - name: cross-binding 对拍（原生逐 bit + wasm 容差 + 篡改自检）
        run: |
          uv sync --project python
          (cd python && uv run maturin develop)
          # check:cross includes the built-in anti-tautology self-check
          # (perturbs each non-reference end in memory, requires detection)
          pnpm check:cross

  # criterion baseline: regressions >20% fail (ci-matrix spec)
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: bench vs previous baseline
        run: |
          # Compare against the default 'base' baseline if one exists
          # (first run has none -> no comparison data, gate passes).
          # Cross-commit persistence (cache or committed baseline) is a
          # phase-2 task; until then this only measures run-to-run noise.
          cargo bench --bench scaffold -- --baseline-lenient=base || true
          cargo bench --bench scaffold -- --save-baseline=ci
          # Fail if current regressed >20% against the saved baseline.
          python3 scripts/bench_gate.py target/criterion
