[package]
name = "netwave-wasm"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
# cdylib only (wasm-pack needs cdylib; an rlib would leave orphan
# artifacts in deps).
crate-type = ["cdylib"]

[dependencies]
netwave = { path = "../../core" }
js-sys = { version = "0.3", features = ["std"] }
wasm-bindgen = "0.2"
