[package]
name = "netwave-python"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
license-file = "../LICENSE-MIT"

[lib]
name = "_netwave"
crate-type = ["cdylib", "rlib"]

[dependencies]
netwave = { path = "../core", features = ["python"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
pyo3-stub-gen = { version = "0.23", optional = true }

[features]
# Enables .pyi generation: pulls the stub annotations into core and the
# gatherer into this crate. Off for normal wheel builds, so the shipped
# .so carries no stub runtime.
stub-gen = ["dep:pyo3-stub-gen", "netwave/pyo3-stub-gen"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stub-gen"]

[lints.rust]
# cargo-llvm-cov auto-sets cfg(coverage); the frequency registrations gate on
# not(coverage) to match core dropping the pyclass/pyfunction attributes there.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
