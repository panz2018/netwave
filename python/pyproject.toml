[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "netwave"
version = "0.0.1"
description = "Network scattering-parameter math (PyO3 bindings, scaffold)"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
# license full texts live at repo root; the wheel build copies them into
# this dir first (see python/README) so maturin bundles both into the wheel.
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["maturin>=1.7", "pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
# This table is what stops pytest from walking up to the repo root and adopting
# the root config: without it the root's bare `--cov` in addopts wins over any
# `--cov=<pkg>` passed on the command line (pytest-cov `_prepare_cov_source`
# turns a valueless `--cov` into "measure everything"), so the scope of this
# project's floor silently becomes the whole repo.
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term"]

[tool.coverage.run]
# Graded unit of the python floor is the published package's Python layer; the
# Rust glue it drives is graded separately by cargo-llvm-cov in ci.yml.
source = ["netwave"]

[tool.coverage.report]
fail_under = 100

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
# Mixed layout: the Rust extension is `netwave._netwave` (renamed so its
# rlib cannot collide with core's `libnetwave.rlib` on the rustdoc path);
# the public `netwave` package is the hand-written `netwave/__init__.py`
# that re-exports it.
module-name = "netwave._netwave"
# Ship the generated type stub in the wheel (task 3.3). stub_gen emits the
# stub and relocates it to `netwave/_netwave.pyi`, the canonical single-file
# stub beside the `netwave/_netwave.abi3.so` extension (maturin mixed layout).
include = [{ path = "netwave/_netwave.pyi", format = "wheel" }]
