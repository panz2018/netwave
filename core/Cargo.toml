[package]
name = "netwave"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false
description = "netwave core: network scattering-parameter math (scaffold phase 0)"

[dependencies]
num-complex = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "scaffold"
harness = false

# dump lives in scripts/ (scoped tooling), cargo only auto-discovers
# examples/ so the path must be declared explicitly.
[[example]]
name = "dump"
path = "scripts/dump.rs"
